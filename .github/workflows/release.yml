name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable release version (e.g. 1.2.3)
        required: true
        type: string
      git_ref:
        description: Git branch to release from
        required: true
        default: main
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

env:
  ELIXIR_VERSION: 1.20.1
  OTP_VERSION: "29.0"
  RUST_VERSION: 1.96.0
  MIX_ENV: prod
  FORNACAST_DATABASE_ADAPTER: postgres

jobs:
  release:
    name: Build Release
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}
          fetch-depth: 0

      - name: Resolve release version
        id: version
        shell: bash
        env:
          VERSION_INPUT: ${{ inputs.version }}
          GIT_REF_INPUT: ${{ inputs.git_ref }}
        run: |
          version="$(scripts/resolve_release_version.sh "$VERSION_INPUT")"
          git_ref="$(git check-ref-format --branch "$GIT_REF_INPUT")"

          if ! git ls-remote --exit-code --heads origin "refs/heads/${git_ref}" >/dev/null; then
            echo "Release branch does not exist on origin: ${git_ref}" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "git_ref=$git_ref" >> "$GITHUB_OUTPUT"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential git libssl-dev pkg-config

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Setup BEAM
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache release dependencies
        uses: actions/cache@v4
        with:
          path: |
            deps
            ~/.hex
            ~/.cache/rebar3
            ~/.cargo/git
            ~/.cargo/registry
          key: ${{ runner.os }}-release-postgres-${{ env.MIX_ENV }}-${{ hashFiles('mix.lock', 'apps/git_core/native/fornacast_git_core/Cargo.lock', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-release-postgres-${{ env.MIX_ENV }}-

      - name: Install Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Update project versions
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # $ENV{VERSION} is expanded by Perl, not the shell.
          # shellcheck disable=SC2016
          find mix.exs apps -name mix.exs -print0 |
            xargs -0 perl -0pi -e 's/version: "[^"]+"/version: "$ENV{VERSION}"/g'

      - name: Fetch dependencies
        run: mix deps.get --only prod

      - name: Compile dependencies
        run: mix deps.compile

      - name: Install frontend dependencies
        run: mix npm.ci

      - name: Build static assets
        run: mix assets.deploy

      - name: Compile application
        run: mix compile

      - name: Build release artifact
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p artifacts
          release_path="${RUNNER_TEMP}/fornacast"
          mix release fornacast --overwrite --path "$release_path"
          test -s "$release_path/lib/git_core-${VERSION}/priv/native/fornacast_git_core.so"
          tar -C "$RUNNER_TEMP" -czf "artifacts/fornacast-${VERSION}-linux-x86_64.tar.gz" fornacast

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Commit release version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mix.exs apps/*/mix.exs

          if git diff --cached --quiet; then
            echo "Files already have requested version ${VERSION}; continuing"
          else
            git commit -m "chore(release): v${VERSION}"
          fi

      - name: Tag release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git rev-parse --verify --quiet "refs/tags/v${VERSION}" >/dev/null; then
            tag_commit="$(git rev-list -n 1 "v${VERSION}")"
            head_commit="$(git rev-parse HEAD)"

            if [[ "$tag_commit" != "$head_commit" ]]; then
              echo "Release tag v${VERSION} points to ${tag_commit}, not ${head_commit}" >&2
              exit 1
            fi

            echo "Release tag v${VERSION} already points to HEAD; continuing"
          else
            git tag "v${VERSION}"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Push release commit and tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GIT_REF: ${{ steps.version.outputs.git_ref }}
        run: |
          git push origin "HEAD:refs/heads/${GIT_REF}"
          git push origin "v${VERSION}"

      - name: Build and publish Docker image
        id: docker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/gsmlg-dev/fornacast:latest
            ghcr.io/gsmlg-dev/fornacast:${{ steps.version.outputs.version }}
          build-args: |
            FORNACAST_DATABASE_ADAPTER=postgres
          cache-from: type=gha,scope=fornacast-release-postgres
          cache-to: type=gha,mode=max,scope=fornacast-release-postgres
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Prepare release deployment notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          <!-- FORNACAST_DEPLOY_NOTES_START -->
          ## Deploy with Docker Compose

          This release image uses PostgreSQL 17 as the supported domain database.
          Default Compose uses complete PostgreSQL component mode. Copy `.env.example`
          to `.env`, then set `POSTGRES_DB`, `POSTGRES_USER`, and
          `POSTGRES_PASSWORD`; Compose supplies the database host and port.

          For Non-Compose deployments and external PostgreSQL providers, configure
          exactly one PostgreSQL connection mode:

          - URL mode uses one nonempty `DATABASE_URL`.
          - Component mode requires nonempty `POSTGRES_HOST`, `POSTGRES_DB`, `POSTGRES_USER`, and `POSTGRES_PASSWORD`. `POSTGRES_PORT` is optional and defaults to `5432` when absent.

          URL mode and component mode are mutually exclusive. Never mix them and
          never provide only part of component mode.

          Concord's separate embedded Turso/VSR configuration store remains
          supported and is not the Ecto domain database. The Turso/libSQL Ecto
          adapter is dormant compile-only source compatibility; it is not a
          supported runtime or release database and is not a release acceptance
          gate.

          - `ghcr.io/gsmlg-dev/fornacast:{{VERSION}}` (release tag)
          - `ghcr.io/gsmlg-dev/fornacast:latest` (latest release)
          - Image digest: `${{ steps.docker.outputs.digest }}`

          For deployment, anonymous pulls work only when the package is public. If
          the package is private, create a separate read-only PAT with
          `read:packages` and authenticate before pulling. Do not use the release
          publisher token:

          ```sh
          export GHCR_USERNAME=your-github-username
          export GHCR_READ_TOKEN=your-read-only-token
          printf '%s' "$GHCR_READ_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
          ```

          Clone the exact release configuration and create its environment file:

          ```sh
          git clone --branch "v{{VERSION}}" --depth 1 https://github.com/gsmlg-opt/Fornacast.git
          cd Fornacast
          cp .env.example .env
          ```

          Generate a strong `SECRET_KEY_BASE`, then edit `.env` to set it. Also set
          `FORNACAST_BASE_URL` to the public base URL and `FORNACAST_SSH_HOST` to
          the public SSH hostname.

          `FORNACAST_LEGACY_TURSO_DATABASE_PATH` defaults to
          `/data/fornacast.db`. If that path contains a legacy Turso domain
          database, this release does not automatically migrate or import it into
          PostgreSQL. Back up the legacy file and `fornacast-data`, then complete
          the decision to migrate it or explicitly abandon it. Set the acknowledgement
          only after the legacy database was intentionally migrated or abandoned;
          planning alone is insufficient:
          `FORNACAST_ACKNOWLEDGE_LEGACY_TURSO_DATA=true`.

          Before deployment, keep public port `4000` blocked in the firewall or
          security group while initializing the instance. Deploy the image by its
          immutable digest:

          ```sh
          export FORNACAST_IMAGE=ghcr.io/gsmlg-dev/fornacast@${{ steps.docker.outputs.digest }}
          docker compose pull app nginx
          docker compose up -d --no-build
          ```

          Treat recovery as a paired backup: the PostgreSQL dump and
          `fornacast-data` must come from the same maintenance window. Create and
          restore the recovery set with:

          ```sh
          scripts/compose_backup.sh BACKUP_DIR
          scripts/compose_restore.sh BACKUP_DIR --confirm-destroy
          ```

          Restore is destructive: it replaces the PostgreSQL database and the
          persisted `fornacast-data` contents with that paired recovery set.

          Complete `/setup` locally or through an SSH tunnel, then open public port
          `4000` in the firewall or security group.

          The public ports are `4000` for HTTP and `2222` for SSH.
          Do not publish ports `4890` or `4891` directly.

          The `postgres-data` volume persists the PostgreSQL domain database. The
          separate `fornacast-data` volume persists repositories, SSH keys,
          LocalCAS release assets, and Concord configuration state.
          <!-- FORNACAST_DEPLOY_NOTES_END -->
          EOF

          sed -i "s/{{VERSION}}/${VERSION}/g" release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          notes="$(cat release-notes.md)"
          asset="artifacts/fornacast-${VERSION}-linux-x86_64.tar.gz#fornacast-${VERSION}-linux-x86_64.tar.gz"

          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            existing_notes="$(gh release view "v${VERSION}" --json body --jq '.body // ""')"
            release_is_draft="$(gh release view "v${VERSION}" --json isDraft --jq .isDraft)"
            existing_without_deploy="$(
              printf '%s\n' "$existing_notes" |
                awk '
                  $0 == "<!-- FORNACAST_DEPLOY_NOTES_START -->" { in_deploy = 1; next }
                  $0 == "<!-- FORNACAST_DEPLOY_NOTES_END -->" { in_deploy = 0; next }
                  !in_deploy { print }
                '
            )"
            combined_notes="$notes"

            if [[ -n "$existing_without_deploy" ]]; then
              combined_notes="${notes}"$'\n\n'"${existing_without_deploy}"
            fi

            gh release edit "v${VERSION}" --notes "$combined_notes"
            gh release upload "v${VERSION}" "$asset" --clobber

            if [[ "$release_is_draft" == "true" ]]; then
              gh release edit "v${VERSION}" --draft=false
            fi
          else
            gh release create "v${VERSION}" \
              "$asset" \
              --title "v${VERSION}" \
              --verify-tag \
              --generate-notes \
              --notes "$notes"
          fi
