name: E2E
run-name: E2E ${{ github.event_name == 'workflow_dispatch' && format('release {0}', inputs.version) || format('pull request {0}', github.event.pull_request.number) }}

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: Release version to test
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ELIXIR_VERSION: 1.20.1
  OTP_VERSION: "29.0"
  RUST_VERSION: 1.96.0
  MIX_ENV: prod
  FORNACAST_DATABASE_ADAPTER: postgres
  FORNACAST_API_BIND_IP: "127.0.0.1"
  FORNACAST_API_PORT: "4101"
  FORNACAST_SSH_PORT: "22222"
  PORT: "4100"

jobs:
  release-smoke:
    name: Release Smoke
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: fornacast_e2e
          POSTGRES_USER: fornacast
          POSTGRES_PASSWORD: fornacast_e2e_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fornacast -d fornacast_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: fornacast_e2e
      POSTGRES_USER: fornacast
      POSTGRES_PASSWORD: fornacast_e2e_password

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve published release version
        if: github.event_name == 'workflow_dispatch'
        id: dispatch_version
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          version="$(scripts/resolve_release_version.sh "$VERSION_INPUT")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential curl git libssl-dev openssh-client openssl pkg-config

      - name: Setup Rust
        if: github.event_name == 'pull_request'
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Setup BEAM
        if: github.event_name == 'pull_request'
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache release dependencies
        if: github.event_name == 'pull_request'
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            ~/.hex
            ~/.cache/rebar3
            ~/.cargo/git
            ~/.cargo/registry
          key: ${{ runner.os }}-e2e-release-postgres-${{ env.MIX_ENV }}-${{ hashFiles('mix.lock', 'apps/git_core/native/fornacast_git_core/Cargo.lock', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-e2e-release-postgres-${{ env.MIX_ENV }}-

      - name: Install Hex and Rebar
        if: github.event_name == 'pull_request'
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Fetch dependencies
        if: github.event_name == 'pull_request'
        run: mix deps.get --only prod

      - name: Clean cached project artifacts
        if: github.event_name == 'pull_request'
        run: mix clean

      - name: Compile dependencies
        if: github.event_name == 'pull_request'
        run: mix deps.compile

      - name: Install frontend dependencies
        if: github.event_name == 'pull_request'
        run: mix npm.ci

      - name: Build static assets
        if: github.event_name == 'pull_request'
        run: mix assets.deploy

      - name: Compile application
        if: github.event_name == 'pull_request'
        run: mix compile

      - name: Build pull request release
        if: github.event_name == 'pull_request'
        run: |
          mix release fornacast --overwrite
          mkdir -p release
          cp -a _build/prod/rel/fornacast release/fornacast
          rm -rf apps/fornacast_web/priv/static

      - name: Download release artifact
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.dispatch_version.outputs.version }}
        run: |
          mkdir -p artifacts
          gh release download "v${VERSION}" \
            --pattern "fornacast-${VERSION}-linux-x86_64.tar.gz" \
            --dir artifacts \
            --clobber

      - name: Extract release artifact
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.dispatch_version.outputs.version }}
        run: |
          mkdir -p release
          tar -xzf "artifacts/fornacast-${VERSION}-linux-x86_64.tar.gz" -C release

      - name: Prepare e2e environment
        run: |
          mkdir -p e2e-data/repos e2e-data/ssh e2e-data/release-assets e2e-work
          legacy_turso_path="${GITHUB_WORKSPACE}/e2e-data/missing-legacy.db"
          test ! -e "$legacy_turso_path"
          ssh-keygen -t ed25519 -f e2e-data/id_ed25519 -N "" -C e2e@example.com
          {
            echo "SECRET_KEY_BASE=$(openssl rand -base64 48)"
            echo "FORNACAST_BASE_URL=http://127.0.0.1:${PORT}"
            echo "FORNACAST_LEGACY_TURSO_DATABASE_PATH=$legacy_turso_path"
            echo "FORNACAST_CONFIG_DATABASE_PATH=${GITHUB_WORKSPACE}/e2e-data/fornacast_config.db"
            echo "FORNACAST_REPO_STORAGE_ROOT=${GITHUB_WORKSPACE}/e2e-data/repos"
            echo "FORNACAST_RELEASE_ASSET_STORAGE_ROOT=${GITHUB_WORKSPACE}/e2e-data/release-assets"
            echo "FORNACAST_SSH_BIND_IP=127.0.0.1"
            echo "FORNACAST_SSH_HOST=127.0.0.1"
            echo "FORNACAST_SSH_SYSTEM_DIR=${GITHUB_WORKSPACE}/e2e-data/ssh"
            echo "E2E_PUBLIC_KEY_PATH=${GITHUB_WORKSPACE}/e2e-data/id_ed25519.pub"
            echo "ELIXIR_ERL_OPTIONS=-kernel inet_dist_use_interface {127,0,0,1}"
            echo "ERL_EPMD_ADDRESS=127.0.0.1"
            echo "RELEASE_DISTRIBUTION=name"
            echo "RELEASE_NODE=fornacast_e2e@127.0.0.1"
          } >> "$GITHUB_ENV"

      - name: Start release
        run: |
          release/fornacast/bin/fornacast start > fornacast.log 2>&1 &
          echo "$!" > fornacast.pid

      - name: Wait for health
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:${PORT}/health" && \
               curl -fsS "http://127.0.0.1:${FORNACAST_API_PORT}/health"; then
              exit 0
            fi
            sleep 2
          done

          cat fornacast.log
          exit 1

      - name: Seed release data
        run: |
          release/fornacast/bin/fornacast rpc '
          public_key = File.read!(System.fetch_env!("E2E_PUBLIC_KEY_PATH"))

          {:ok, user} =
            ForgeAccounts.create_first_admin(%{
              username: "alice",
              email: "alice@example.com",
              password: "correct horse battery staple"
            })

          Fornacast.Setup.mark_initialized!(user)

          {:ok, _key} =
            ForgeAccounts.create_ssh_key(user, %{
              title: "github-actions",
              public_key: public_key
            })

          {:ok, _repo} =
            ForgeRepos.create_repository(user, %{
              name: "Demo",
              slug: "demo",
              description: "e2e release smoke"
            })
          '

      - name: Inspect embedded LocalCAS release
        run: |
          test -d release/fornacast/lib/ex_storage_service-0.6.4
          s3_package="$(find release/fornacast/lib -maxdepth 1 -type d -name 'ex_storage_service_s3-*' -print -quit)"
          test -z "$s3_package"
          release/fornacast/bin/fornacast rpc '
            true = Node.self() == :"fornacast_e2e@127.0.0.1"
            true = ExStorageService.Cluster.Readiness.ready?(timeout: 1_000)
            true = ForgeReleases.AssetStorage.Manager.ready?()
            nil = Application.spec(:ex_storage_service_s3)
            instance = GenServer.whereis(ExStorageService.Names.instance_supervisor(:fornacast_release_assets))
            [{_, engine, :worker, [ExStorageService.Storage.Engine]}] = Supervisor.which_children(instance)
            true = is_pid(engine)
          '
          sh scripts/release_asset_storage_smoke.sh release/fornacast write
          listeners="$(ss -ltn)"
          ! grep -Eq ':(9000|9100)[[:space:]]' <<< "$listeners"

      - name: Push repository over SSH
        run: |
          git init e2e-work/demo
          git -C e2e-work/demo config user.name "Fornacast E2E"
          git -C e2e-work/demo config user.email "e2e@example.com"
          printf '# Demo\n\nE2E release smoke.\n' > e2e-work/demo/README.md
          git -C e2e-work/demo add README.md
          git -C e2e-work/demo commit -m "Initial e2e commit"
          git -C e2e-work/demo branch -M main
          git -C e2e-work/demo remote add origin "ssh://alice@127.0.0.1:${FORNACAST_SSH_PORT}/alice/demo.git"
          GIT_SSH_COMMAND="ssh -F /dev/null -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=${GITHUB_WORKSPACE}/e2e-data/known_hosts -i ${GITHUB_WORKSPACE}/e2e-data/id_ed25519" \
            git -C e2e-work/demo push -u origin main

      - name: Verify web repository browser
        run: |
          curl -fsS -c e2e-data/cookies.txt "http://127.0.0.1:${PORT}/login" > e2e-data/login.html
          CSRF_TOKEN="$(sed -n 's/.*name="_csrf_token" value="\([^"]*\)".*/\1/p' e2e-data/login.html | head -n 1)"
          test -n "$CSRF_TOKEN"

          curl -fsS \
            -b e2e-data/cookies.txt \
            -c e2e-data/cookies.txt \
            -o /dev/null \
            -X POST "http://127.0.0.1:${PORT}/login" \
            --data-urlencode "_csrf_token=${CSRF_TOKEN}" \
            --data-urlencode "session[username]=alice" \
            --data-urlencode "session[password]=correct horse battery staple"

          curl -fsS -b e2e-data/cookies.txt "http://127.0.0.1:${PORT}/alice/demo" > e2e-data/repository.html
          grep "E2E release smoke" e2e-data/repository.html

          STYLESHEET_TAG="$(grep -oE '<link[^>]*rel="stylesheet"[^>]*>' e2e-data/repository.html | head -n 1)"
          MODULE_SCRIPT_TAG="$(grep -oE '<script[^>]*type="module"[^>]*>' e2e-data/repository.html | head -n 1)"
          STYLESHEET_URL="$(printf '%s\n' "$STYLESHEET_TAG" | sed -n 's/.*href="\([^"]*\)".*/\1/p')"
          MODULE_SCRIPT_URL="$(printf '%s\n' "$MODULE_SCRIPT_TAG" | sed -n 's/.*src="\([^"]*\)".*/\1/p')"

          test -n "$STYLESHEET_URL"
          test -n "$MODULE_SCRIPT_URL"
          [[ "$STYLESHEET_URL" == /* && "$STYLESHEET_URL" != //* ]]
          [[ "$MODULE_SCRIPT_URL" == /* && "$MODULE_SCRIPT_URL" != //* ]]

          curl -fsS "http://127.0.0.1:${PORT}${STYLESHEET_URL}" > e2e-data/app.css
          grep -F '.auth-shell' e2e-data/app.css
          curl -fsS -o /dev/null "http://127.0.0.1:${PORT}${MODULE_SCRIPT_URL}"
          curl -fsS -b e2e-data/cookies.txt "http://127.0.0.1:${PORT}/alice/demo/raw/main/README.md" | grep "E2E release smoke"

      - name: Restart release with persisted LocalCAS bytes
        run: |
          old_pid="$(cat fornacast.pid)"
          timeout 45 release/fornacast/bin/fornacast stop

          for attempt in $(seq 1 45); do
            if ! kill -0 "$old_pid" 2>/dev/null; then
              break
            fi
            if [ "$attempt" = 45 ]; then
              echo "release process $old_pid did not exit after a normal stop" >&2
              exit 1
            fi
            sleep 1
          done

          release/fornacast/bin/fornacast start > fornacast-restart.log 2>&1 &
          echo "$!" > fornacast.pid

          for attempt in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:${PORT}/health" >/dev/null && \
               release/fornacast/bin/fornacast rpc 'true = Node.self() == :"fornacast_e2e@127.0.0.1"; true = ExStorageService.Cluster.Readiness.ready?(timeout: 1_000); true = ForgeReleases.AssetStorage.Manager.ready?()'; then
              break
            fi
            if [ "$attempt" = 60 ]; then
              cat fornacast-restart.log
              exit 1
            fi
            sleep 2
          done

          sh scripts/release_asset_storage_smoke.sh release/fornacast verify
          GIT_SSH_COMMAND="ssh -F /dev/null -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=${GITHUB_WORKSPACE}/e2e-data/known_hosts -i ${GITHUB_WORKSPACE}/e2e-data/id_ed25519" \
            git -C e2e-work/demo ls-remote origin refs/heads/main

      - name: Log in to GHCR for published image
        if: github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Verify default Compose distribution
        env:
          VERSION: ${{ steps.dispatch_version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          compose_project="fornacast-e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if ! printf '%s\n' "$compose_project" | grep -Eq '^fornacast-e2e-[0-9]+-[0-9]+$'; then
            echo "refusing unsafe Compose project name" >&2
            exit 64
          fi

          export COMPOSE_PROJECT_NAME=$compose_project
          export SECRET_KEY_BASE="$(openssl rand -hex 32)"
          export FORNACAST_BASE_URL=http://127.0.0.1:4000
          export FORNACAST_CONFIG_DATABASE_PATH=/data/fornacast_config.db
          export FORNACAST_SSH_HOST=localhost
          export FORNACAST_SSH_PORT=2222
          export POSTGRES_DB=fornacast_compose_e2e
          export POSTGRES_USER=fornacast
          export POSTGRES_PASSWORD="$(openssl rand -hex 24)"

          cleanup() {
            status=$?
            trap - EXIT
            if [ "$status" -ne 0 ]; then
              docker compose logs > compose-e2e/compose.log 2>&1 || true
            fi
            docker compose down -v --remove-orphans >/dev/null 2>&1 || true
            exit "$status"
          }
          trap cleanup EXIT

          mkdir -p compose-e2e
          ssh-keygen -t ed25519 -f compose-e2e/id_ed25519 -N "" -C compose-e2e@example.com

          case "$GITHUB_EVENT_NAME" in
            pull_request)
              docker build \
                --build-arg FORNACAST_DATABASE_ADAPTER=postgres \
                --tag "fornacast-e2e:${GITHUB_SHA}" \
                .
              export FORNACAST_IMAGE="fornacast-e2e:${GITHUB_SHA}"
              ;;
            workflow_dispatch)
              export FORNACAST_IMAGE="ghcr.io/gsmlg-dev/fornacast:${VERSION}"
              ;;
            *)
              echo "unsupported E2E event: $GITHUB_EVENT_NAME" >&2
              exit 64
              ;;
          esac

          docker compose up -d --no-build --wait --wait-timeout 180
          scripts/api_proxy_smoke.sh http://127.0.0.1:4000
          docker compose cp compose-e2e/id_ed25519.pub app:/tmp/compose_e2e.pub

          docker compose exec -T app /app/bin/fornacast rpc '
          public_key = File.read!("/tmp/compose_e2e.pub")

          {:ok, user} =
            ForgeAccounts.create_first_admin(%{
              username: "compose",
              email: "compose@example.com",
              password: "correct horse battery staple"
            })

          Fornacast.Setup.mark_initialized!(user)

          {:ok, _api_key, _secret} =
            ForgeAccounts.create_api_key(user, %{
              name: "compose-e2e",
              scopes: ["repo"]
            })

          {:ok, _ssh_key} =
            ForgeAccounts.create_ssh_key(user, %{
              title: "compose-e2e",
              public_key: public_key
            })

          {:ok, _repo} =
            ForgeRepos.create_repository(user, %{
              name: "Compose Demo",
              slug: "compose-demo",
              description: "default Compose distribution e2e"
            })
          '

          git init compose-e2e/compose-demo
          git -C compose-e2e/compose-demo config user.name "Fornacast Compose E2E"
          git -C compose-e2e/compose-demo config user.email "compose-e2e@example.com"
          printf '# Compose Demo\n\nDefault Compose distribution.\n' > compose-e2e/compose-demo/README.md
          git -C compose-e2e/compose-demo add README.md
          git -C compose-e2e/compose-demo commit -m "Initial Compose e2e commit"
          git -C compose-e2e/compose-demo branch -M main
          git -C compose-e2e/compose-demo remote add origin "ssh://compose@127.0.0.1:2222/compose/compose-demo.git"
          GIT_SSH_COMMAND="ssh -F /dev/null -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=${GITHUB_WORKSPACE}/compose-e2e/known_hosts -i ${GITHUB_WORKSPACE}/compose-e2e/id_ed25519" \
            git -C compose-e2e/compose-demo push -u origin main

          docker compose exec -T app /app/bin/release_asset_storage_smoke /app write

          mapfile -t old_app_ids < <(docker compose ps -q app)
          test "${#old_app_ids[@]}" -eq 1
          old_app_id="${old_app_ids[0]}"
          test -n "$old_app_id"

          docker compose stop --timeout 45 app
          test "$(docker container inspect -f '{{.State.Running}}' "$old_app_id")" = false
          test "$(docker container inspect -f '{{.State.ExitCode}}' "$old_app_id")" = 0
          test "$(docker container inspect -f '{{.State.OOMKilled}}' "$old_app_id")" = false
          docker compose rm -f app
          ! docker container inspect "$old_app_id" >/dev/null 2>&1

          docker compose up -d --no-build --wait --wait-timeout 180 app
          mapfile -t new_app_ids < <(docker compose ps -q app)
          test "${#new_app_ids[@]}" -eq 1
          new_app_id="${new_app_ids[0]}"
          test -n "$new_app_id"
          test "$new_app_id" != "$old_app_id"

          docker compose restart nginx
          scripts/api_proxy_smoke.sh http://127.0.0.1:4000
          docker compose exec -T app /app/bin/release_asset_storage_smoke /app verify
          GIT_SSH_COMMAND="ssh -F /dev/null -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=${GITHUB_WORKSPACE}/compose-e2e/known_hosts -i ${GITHUB_WORKSPACE}/compose-e2e/id_ed25519" \
            git -C compose-e2e/compose-demo ls-remote origin refs/heads/main

      - name: Stop release
        if: always()
        run: |
          if [ -f fornacast.pid ]; then
            kill "$(cat fornacast.pid)" || true
          fi

      - name: Upload release logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fornacast-e2e-logs
          path: |
            fornacast.log
            fornacast-restart.log
            compose-e2e/compose.log
