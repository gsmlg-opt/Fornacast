services:
  app:
    image: ${FORNACAST_IMAGE:-ghcr.io/gsmlg-dev/fornacast:latest}
    build:
      context: .
      args:
        FORNACAST_DATABASE_ADAPTER: postgres
    environment:
      FORNACAST_DATABASE_ADAPTER: postgres
      FORNACAST_ACKNOWLEDGE_LEGACY_TURSO_DATA: ${FORNACAST_ACKNOWLEDGE_LEGACY_TURSO_DATA:-}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      FORNACAST_CONFIG_DATABASE_PATH: ${FORNACAST_CONFIG_DATABASE_PATH:-/data/fornacast_config.db}
      FORNACAST_CONFIG_TURSO_DATABASE_URL: ${FORNACAST_CONFIG_TURSO_DATABASE_URL:-}
      FORNACAST_CONFIG_TURSO_AUTH_TOKEN: ${FORNACAST_CONFIG_TURSO_AUTH_TOKEN:-}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set SECRET_KEY_BASE}
      FORNACAST_BASE_URL: ${FORNACAST_BASE_URL:-http://localhost:4000}
      FORNACAST_API_BIND_IP: 0.0.0.0
      FORNACAST_API_PORT: 4891
      FORNACAST_API_TRUSTED_PROXIES: 172.30.0.0/24
      FORNACAST_REPO_STORAGE_ROOT: /data/repos
      FORNACAST_RELEASE_ASSET_STORAGE_ROOT: /data/release-assets
      FORNACAST_RELEASE_ASSET_MAX_BYTES: ${FORNACAST_RELEASE_ASSET_MAX_BYTES:-2147483648}
      FORNACAST_RELEASE_ASSET_GC_GRACE_SECONDS: ${FORNACAST_RELEASE_ASSET_GC_GRACE_SECONDS:-86400}
      FORNACAST_SSH_HOST: ${FORNACAST_SSH_HOST:-localhost}
      FORNACAST_SSH_PORT: ${FORNACAST_SSH_PORT:-2222}
      FORNACAST_SSH_SYSTEM_DIR: /data/ssh
      PORT: 4890
      ELIXIR_ERL_OPTIONS: -kernel inet_dist_use_interface {127,0,0,1}
      ERL_EPMD_ADDRESS: 127.0.0.1
      RELEASE_DISTRIBUTION: name
      RELEASE_NODE: fornacast@127.0.0.1
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:4890/health >/dev/null && curl -fsS http://127.0.0.1:4891/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
    expose:
      - "4890"
      - "4891"
      - "2222"
    ports:
      - "2222:2222"
    volumes:
      - fornacast-data:/data
    networks:
      - fornacast-internal
    stop_grace_period: 45s

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fornacast-internal

  nginx:
    image: nginx:1.29-alpine
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./deploy/nginx/fornacast.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "4000:8080"
    networks:
      - fornacast-internal

volumes:
  fornacast-data:
  postgres-data:

networks:
  fornacast-internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
